services:
  - type: web
    name: clearpath-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: APP_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: "*"          # tighten to your Vercel URL after the frontend is deployed
      - key: TOMTOM_API_KEY
        sync: false          # set this in the Render dashboard — don't commit real keys
      - key: CACHE_TTL_SECONDS
        value: "60"
